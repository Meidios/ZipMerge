name: Publish Windows release

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zipmerge-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt PyInstaller==6.18.0 pyinstaller-hooks-contrib==2026.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install innosetup --version=6.7.3 --yes --no-progress --force --allow-downgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare application resources
        run: python -X utf8 tools/fetch_vendor.py
      - name: Run regression tests
        run: python -X utf8 -m unittest discover -s tests -t .
      - name: Build with verified notices and corresponding sources
        run: python -X utf8 tools/build_release.py
      - name: Verify packaged runtime and license inventory
        run: python -X utf8 tools/verify_bundle.py
      - name: Verify the actual installer payload without installing
        run: python -X utf8 tools/verify_installer.py
      - name: Create release assets and checksums
        run: |
          python -X utf8 tools/package_release_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "import sys; sys.path.insert(0,'src'); from zipmerge import __version__; print(__version__)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:VERSION"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existing | ConvertFrom-Json).isDraft)) {
              throw "Release $tag is already published; refusing to replace public assets."
            }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --draft --title "ZipMerge $env:VERSION" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit $tag --target $env:GITHUB_SHA --draft=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseAssets = Get-ChildItem build/release-assets -File | ForEach-Object FullName
          gh release upload $tag @releaseAssets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
